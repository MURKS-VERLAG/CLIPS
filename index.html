<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Animation Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="vault" class="vault" aria-label="Animation Vault">
    <header class="vault__header">
      <h1>ANIMATION VAULT</h1>
      <p id="pageLabel" class="vault__page-label">SEITE 1 / 2</p>
    </header>

    <section id="clipGrid" class="clip-grid" aria-label="Clip-Auswahl"></section>

    <nav class="page-nav" aria-label="Seitennavigation">
      <button
        id="prevPage"
        class="page-nav__button page-nav__button--prev"
        type="button"
        aria-label="Vorherige Seite"
        title="Vorherige Seite"
      >
        ←
      </button>

      <button
        id="nextPage"
        class="page-nav__button page-nav__button--next"
        type="button"
        aria-label="Nächste Seite"
        title="Nächste Seite"
      >
        →
      </button>
    </nav>
  </main>

  <section
    id="clipStage"
    aria-label="Clip 01 Testfläche"
    hidden
    style="
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 45%, rgba(214, 173, 84, 0.04), transparent 46%),
        #050505;
    "
  >
    <div
      style="
        position: relative;
        width: min(94vw, 1760px);
        aspect-ratio: 16 / 9;
        max-height: 92vh;
        background: #080808;
        border: 3px double #d6ad54;
        box-shadow:
          inset 0 0 0 7px #080808,
          inset 0 0 0 8px rgba(214, 173, 84, 0.55),
          inset 0 0 45px rgba(214, 173, 84, 0.05),
          0 0 30px rgba(214, 173, 84, 0.18);
        overflow: hidden;
      "
    >
      <div style="position:absolute;top:14px;left:14px;width:72px;height:72px;border-top:4px double #d6ad54;border-left:4px double #d6ad54;border-radius:20px 0 0 0;"></div>
      <div style="position:absolute;top:14px;right:14px;width:72px;height:72px;border-top:4px double #d6ad54;border-right:4px double #d6ad54;border-radius:0 20px 0 0;"></div>
      <div style="position:absolute;bottom:14px;left:14px;width:72px;height:72px;border-bottom:4px double #d6ad54;border-left:4px double #d6ad54;border-radius:0 0 0 20px;"></div>
      <div style="position:absolute;bottom:14px;right:14px;width:72px;height:72px;border-bottom:4px double #d6ad54;border-right:4px double #d6ad54;border-radius:0 0 20px 0;"></div>

      <div style="position:absolute;top:18px;left:9%;right:9%;height:1px;background:linear-gradient(90deg,transparent,#d6ad54,#f4cf78,#d6ad54,transparent);"></div>
      <div style="position:absolute;bottom:18px;left:9%;right:9%;height:1px;background:linear-gradient(90deg,transparent,#d6ad54,#f4cf78,#d6ad54,transparent);"></div>
      <div style="position:absolute;top:50%;left:10px;transform:translateY(-50%);color:#f4cf78;font-size:22px;text-shadow:0 0 8px rgba(244,207,120,.35);">✦</div>
      <div style="position:absolute;top:50%;right:10px;transform:translateY(-50%);color:#f4cf78;font-size:22px;text-shadow:0 0 8px rgba(244,207,120,.35);">✦</div>
      <div style="position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(45deg);color:#f4cf78;font-size:20px;text-shadow:0 0 8px rgba(244,207,120,.35);">◆</div>
      <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(45deg);color:#f4cf78;font-size:20px;text-shadow:0 0 8px rgba(244,207,120,.35);">◆</div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>

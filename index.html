<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Animation Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clip-stage {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .clip-stage__background,
    .clip-stage__background-next {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }

    .clip-stage__background {
      z-index: 1;
    }

    .clip-stage__background-next {
      z-index: 2;
      opacity: 0;
      transition: opacity 180ms ease-in-out;
    }

    .clip01-animation-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }

    .clip01-symbol {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      width: var(--symbol-width);
      height: auto;
      opacity: 0;
      transform: translate(-50%, -50%) scale(var(--symbol-scale, 1));
      transform-origin: center center;
      will-change: left, top, opacity, transform;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.45));
    }

    .clip01-symbol.is-mirrored {
      transform: translate(-50%, -50%) scaleX(-1) scale(var(--symbol-scale, 1));
    }

    .clip01-puff {
      position: absolute;
      z-index: 20;
      width: clamp(95px, 12vw, 230px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.25);
      opacity: 0;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(1px);
    }

    .clip01-puff::before,
    .clip01-puff::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .clip01-puff--dark {
      background:
        radial-gradient(circle at 48% 52%, rgba(20,20,20,.98) 0 21%, rgba(78,78,78,.84) 22% 37%, rgba(20,20,20,.82) 38% 54%, transparent 69%);
    }

    .clip01-puff--dark::before {
      inset: 8% 33% 39% 2%;
      background: radial-gradient(circle, rgba(105,105,105,.9) 0 36%, rgba(18,18,18,.76) 58%, transparent 72%);
    }

    .clip01-puff--dark::after {
      inset: 31% 3% 7% 35%;
      background: radial-gradient(circle, rgba(82,82,82,.88) 0 34%, rgba(12,12,12,.82) 58%, transparent 73%);
    }

    .clip01-puff--gold {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,225,111,.98) 0 19%, rgba(214,164,43,.88) 21% 40%, rgba(111,70,5,.72) 42% 58%, transparent 72%);
      filter: blur(1px) drop-shadow(0 0 18px rgba(241,194,69,.62));
    }

    .clip01-puff--gold::before {
      inset: 5% 38% 40% 1%;
      background: radial-gradient(circle, rgba(255,233,138,.95), rgba(175,116,13,.68) 58%, transparent 74%);
    }

    .clip01-puff--gold::after {
      inset: 35% 1% 4% 38%;
      background: radial-gradient(circle, rgba(255,217,84,.94), rgba(155,94,7,.68) 58%, transparent 74%);
    }

    .clip01-puff.is-active {
      animation: clip01Puff 1.25s ease-out forwards;
    }

    @keyframes clip01Puff {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.16); }
      14%  { opacity: 1; transform: translate(-50%, -50%) scale(.72); }
      48%  { opacity: .98; transform: translate(-50%, -50%) scale(1.18); }
      76%  { opacity: .72; transform: translate(-50%, -50%) scale(1.42); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.72); }
    }

    .clip01-smoke-veil {
      position: absolute;
      inset: 0;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition:
        opacity 220ms ease-out,
        filter 520ms ease-out;
      filter: blur(2px);
    }

    .clip01-smoke-veil__dark {
      position: absolute;
      inset: -14%;
      transform: scale(.76);
      opacity: 0;
      background:
        radial-gradient(circle at 8% 10%, rgba(42,42,42,.96) 0 8%, rgba(9,9,9,.96) 17%, transparent 30%),
        radial-gradient(circle at 92% 10%, rgba(48,48,48,.96) 0 8%, rgba(7,7,7,.97) 17%, transparent 30%),
        radial-gradient(circle at 7% 51%, rgba(55,55,55,.96) 0 10%, rgba(8,8,8,.98) 21%, transparent 37%),
        radial-gradient(circle at 93% 51%, rgba(48,48,48,.96) 0 10%, rgba(7,7,7,.98) 21%, transparent 37%),
        radial-gradient(circle at 8% 92%, rgba(50,50,50,.96) 0 10%, rgba(7,7,7,.98) 21%, transparent 36%),
        radial-gradient(circle at 92% 92%, rgba(50,50,50,.96) 0 10%, rgba(7,7,7,.98) 21%, transparent 36%),
        radial-gradient(ellipse at center, rgba(8,8,8,.92) 0 39%, rgba(12,12,12,.97) 58%, rgba(0,0,0,.99) 76%, transparent 88%);
      transition:
        opacity 210ms ease-out,
        transform 520ms cubic-bezier(.2,.72,.22,1);
    }

    .clip01-smoke-veil__gold {
      position: absolute;
      left: 50%;
      top: 10%;
      width: clamp(230px, 24vw, 460px);
      aspect-ratio: 1.35;
      transform: translate(-50%, -50%) scale(.42);
      opacity: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 48% 53%, rgba(255,231,138,.98) 0 12%, rgba(232,181,54,.95) 25%, rgba(158,99,7,.72) 44%, rgba(74,43,0,.42) 58%, transparent 75%);
      filter: blur(5px) drop-shadow(0 0 26px rgba(236,188,63,.7));
      transition:
        opacity 190ms ease-out,
        transform 500ms cubic-bezier(.2,.72,.22,1);
    }

    .clip01-smoke-veil.is-active {
      opacity: 1;
    }

    .clip01-smoke-veil.is-active .clip01-smoke-veil__dark {
      opacity: 1;
      transform: scale(1.08);
    }

    .clip01-smoke-veil.is-active .clip01-smoke-veil__gold {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.12);
    }

    .clip01-smoke-veil.is-clearing {
      opacity: 0;
      filter: blur(8px);
    }

    .clip01-smoke-veil.is-clearing .clip01-smoke-veil__dark {
      opacity: 0;
      transform: scale(1.22);
    }

    .clip01-smoke-veil.is-clearing .clip01-smoke-veil__gold {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1.42);
    }
  </style>
</head>

<body>
  <main id="vault" class="vault" aria-label="Animation Vault">
    <header class="vault__header">
      <h1>ANIMATION VAULT</h1>
      <p id="pageLabel" class="vault__page-label">SEITE 1 / 4</p>
    </header>

    <section id="clipGrid" class="clip-grid" aria-label="Clip-Auswahl"></section>

    <nav class="page-nav" aria-label="Seitennavigation">
      <button
        id="prevPage"
        class="page-nav__button page-nav__button--prev"
        type="button"
        aria-label="Vorherige Seite"
        title="Vorherige Seite"
      >←</button>

      <button
        id="nextPage"
        class="page-nav__button page-nav__button--next"
        type="button"
        aria-label="Nächste Seite"
        title="Nächste Seite"
      >→</button>
    </nav>
  </main>

  <section id="clipStage" class="clip-stage" aria-label="Clip-Bühne" hidden>
    <img
      id="clipStageBackground"
      class="clip-stage__background"
      src="assets/clip-frame.png"
      alt=""
      draggable="false"
    >
    <img
      id="clipStageBackgroundNext"
      class="clip-stage__background-next"
      src=""
      alt=""
      draggable="false"
    >
    <div id="clip01AnimationLayer" class="clip01-animation-layer"></div>
  </section>

  <script src="app.js?v=clip01-sequence-04"></script>
</body>
</html>

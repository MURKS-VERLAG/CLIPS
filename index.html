<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Animation Vault</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .clip-stage {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 50% 45%, rgba(173, 127, 39, 0.08), transparent 45%),
        linear-gradient(180deg, #080706 0%, #030303 100%);
    }

    .medieval-frame {
      --gold: #b98a2d;
      --gold-light: #f1cf73;
      --gold-dark: #694715;

      position: relative;
      width: min(95vw, 1800px);
      aspect-ratio: 16 / 9;
      max-height: 94vh;
      overflow: hidden;
      background:
        radial-gradient(circle at center, #0c0b09 0%, #070706 64%, #040403 100%);
      border: 2px solid var(--gold-light);
      box-shadow:
        0 0 0 5px #171109,
        0 0 0 7px var(--gold-dark),
        0 0 0 11px #090705,
        0 0 0 13px var(--gold),
        0 0 38px rgba(224, 180, 78, 0.25),
        inset 0 0 60px rgba(166, 117, 27, 0.07);
    }

    .medieval-frame::before {
      content: "";
      position: absolute;
      inset: 20px;
      pointer-events: none;
      border: 1px solid rgba(241, 207, 115, 0.72);
      box-shadow:
        inset 0 0 0 4px #0a0805,
        inset 0 0 0 5px rgba(185, 138, 45, 0.6);
    }

    .medieval-frame::after {
      content: "";
      position: absolute;
      inset: 32px;
      pointer-events: none;
      border: 1px solid rgba(105, 71, 21, 0.95);
    }

    .ornament {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      color: var(--gold-light);
      filter: drop-shadow(0 0 5px rgba(241, 207, 115, 0.28));
    }

    .corner {
      width: 118px;
      height: 118px;
    }

    .corner svg,
    .crest svg,
    .side-ornament svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .corner--tl {
      top: 18px;
      left: 18px;
    }

    .corner--tr {
      top: 18px;
      right: 18px;
      transform: scaleX(-1);
    }

    .corner--bl {
      bottom: 18px;
      left: 18px;
      transform: scaleY(-1);
    }

    .corner--br {
      right: 18px;
      bottom: 18px;
      transform: scale(-1);
    }

    .crest {
      width: 180px;
      height: 92px;
      left: 50%;
      transform: translateX(-50%);
    }

    .crest--top {
      top: 3px;
    }

    .crest--bottom {
      bottom: 3px;
      transform: translateX(-50%) rotate(180deg);
    }

    .side-ornament {
      width: 74px;
      height: 128px;
      top: 50%;
      transform: translateY(-50%);
    }

    .side-ornament--left {
      left: 3px;
    }

    .side-ornament--right {
      right: 3px;
      transform: translateY(-50%) scaleX(-1);
    }

    .edge-knot {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          45deg,
          transparent 0 8px,
          rgba(185, 138, 45, 0.6) 8px 9px,
          transparent 9px 17px
        );
      opacity: 0.65;
    }

    .edge-knot--top,
    .edge-knot--bottom {
      left: 18%;
      right: 18%;
      height: 12px;
    }

    .edge-knot--top {
      top: 23px;
    }

    .edge-knot--bottom {
      bottom: 23px;
      transform: scaleY(-1);
    }

    .edge-knot--left,
    .edge-knot--right {
      top: 20%;
      bottom: 20%;
      width: 12px;
      background:
        repeating-linear-gradient(
          135deg,
          transparent 0 8px,
          rgba(185, 138, 45, 0.6) 8px 9px,
          transparent 9px 17px
        );
    }

    .edge-knot--left {
      left: 23px;
    }

    .edge-knot--right {
      right: 23px;
      transform: scaleX(-1);
    }

    @media (max-width: 900px) {
      .clip-stage {
        padding: 14px;
      }

      .corner {
        width: 78px;
        height: 78px;
      }

      .crest {
        width: 125px;
        height: 65px;
      }

      .side-ornament {
        width: 50px;
        height: 90px;
      }
    }
  </style>
</head>

<body>
  <main id="vault" class="vault" aria-label="Animation Vault">
    <header class="vault__header">
      <h1>ANIMATION VAULT</h1>
      <p id="pageLabel" class="vault__page-label">SEITE 1 / 2</p>
    </header>

    <section id="clipGrid" class="clip-grid" aria-label="Clip-Auswahl"></section>

    <nav class="page-nav" aria-label="Seitennavigation">
      <button
        id="prevPage"
        class="page-nav__button page-nav__button--prev"
        type="button"
        aria-label="Vorherige Seite"
        title="Vorherige Seite"
      >
        ←
      </button>

      <button
        id="nextPage"
        class="page-nav__button page-nav__button--next"
        type="button"
        aria-label="Nächste Seite"
        title="Nächste Seite"
      >
        →
      </button>
    </nav>
  </main>

  <section id="clipStage" class="clip-stage" aria-label="Clip 01" hidden>
    <div class="medieval-frame">

      <div class="edge-knot edge-knot--top"></div>
      <div class="edge-knot edge-knot--bottom"></div>
      <div class="edge-knot edge-knot--left"></div>

            <path d="M17 98V35Q17 17 35 17H98"/>
            <path d="M28 92C28 61 40 40 69 28"/>
            <path d="M31 76C44 72 52 64 57 51"/>
            <path d="M41 42C54 46 64 41 72 30"/>
            <path d="M44 89C50 74 61 65 78 61"/>
          </g>
          <g fill="#e9c665">

            <circle cx="35" cy="66" r="3"/>

      <div class="ornament corner corner--br">
        <svg viewBox="0 0 120 120" aria-hidden="true">

            <path d="M17 98V35Q17 17 35 17H98"/>
            <path d="M28 92C28 61 40 40 69 28"/>
            <path d="M31 76C44 72 52 64 57 51"/>
            <path d="M41 42C54 46 64 41 72 30"/>
            <path d="M44 89C50 74 61 65 78 61"/>
          </g>
          <g fill="#e9c665">
            <path d="M22 22l6 6-6 6-6-6z"/>
            <circle cx="35" cy="66" r="3"/>
            <circle cx="66" cy="35" r="3"/>

        </svg>

      <div class="ornament crest crest--top">

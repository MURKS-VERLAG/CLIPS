<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Animation Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clip-stage {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .clip-stage__background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main id="vault" class="vault" aria-label="Animation Vault">
    <header class="vault__header">
      <h1>ANIMATION VAULT</h1>
      <p id="pageLabel" class="vault__page-label">SEITE 1 / 2</p>
    </header>

    <section id="clipGrid" class="clip-grid" aria-label="Clip-Auswahl"></section>

    <nav class="page-nav" aria-label="Seitennavigation">
      <button
        id="prevPage"
        class="page-nav__button page-nav__button--prev"
        type="button"
        aria-label="Vorherige Seite"
        title="Vorherige Seite"
      >
        ←
      </button>

      <button
        id="nextPage"
        class="page-nav__button page-nav__button--next"
        type="button"
        aria-label="Nächste Seite"
        title="Nächste Seite"
      >
        →
      </button>
    </nav>
  </main>

  <section id="clipStage" class="clip-stage" aria-label="Clip-Bühne" hidden>
    <img
      class="clip-stage__background"
      src="assets/clip-frame.png"
      alt=""
      draggable="false"
    >
  </section>

  <script src="app.js?v=clip-stage-01"></script>
</body>
</html>

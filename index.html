<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <title>Animation Vault</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .clip-stage {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .clip-stage__background,
    .clip-stage__background-next {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }

    .clip-stage__background {
      z-index: 1;
    }

    .clip-stage__background-next {
      z-index: 2;
      opacity: 0;
      transition: opacity 180ms ease-in-out;
    }

    .clip01-animation-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }

    .clip01-symbol {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      width: var(--symbol-width);
      height: auto;
      opacity: 0;
      transform: translate(-50%, -50%) scale(var(--symbol-scale, 1));
      transform-origin: center center;
      will-change: left, top, opacity, transform;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.45));
    }

    .clip01-symbol.is-mirrored {
      transform: translate(-50%, -50%) scaleX(-1) scale(var(--symbol-scale, 1));
    }

    .clip01-puff {
      position: absolute;
      z-index: 20;
      width: clamp(125px, 15vw, 300px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%) scale(.25);
      opacity: 0;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(1.4px);
    }

    .clip01-puff::before,
    .clip01-puff::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .clip01-puff--dark {
      background:
        radial-gradient(circle at 48% 52%, rgba(20,20,20,.98) 0 21%, rgba(78,78,78,.84) 22% 37%, rgba(20,20,20,.82) 38% 54%, transparent 69%);
    }

    .clip01-puff--dark::before {
      inset: 8% 33% 39% 2%;
      background: radial-gradient(circle, rgba(105,105,105,.9) 0 36%, rgba(18,18,18,.76) 58%, transparent 72%);
    }

    .clip01-puff--dark::after {
      inset: 31% 3% 7% 35%;
      background: radial-gradient(circle, rgba(82,82,82,.88) 0 34%, rgba(12,12,12,.82) 58%, transparent 73%);
    }

    .clip01-puff--gold {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,225,111,.98) 0 19%, rgba(214,164,43,.88) 21% 40%, rgba(111,70,5,.72) 42% 58%, transparent 72%);
      filter: blur(1.4px) drop-shadow(0 0 22px rgba(241,194,69,.68));
    }

    .clip01-puff--gold::before {
      inset: 5% 38% 40% 1%;
      background: radial-gradient(circle, rgba(255,233,138,.95), rgba(175,116,13,.68) 58%, transparent 74%);
    }

    .clip01-puff--gold::after {
      inset: 35% 1% 4% 38%;
      background: radial-gradient(circle, rgba(255,217,84,.94), rgba(155,94,7,.68) 58%, transparent 74%);
    }

    .clip01-puff.is-active {
      animation: clip01Puff 2.25s ease-out forwards;
    }

    @keyframes clip01Puff {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(.15); }
      10%  { opacity: 1; transform: translate(-50%, -50%) scale(.70); }
      34%  { opacity: .99; transform: translate(-50%, -50%) scale(1.15); }
      58%  { opacity: .92; transform: translate(-50%, -50%) scale(1.42); }
      76%  { opacity: .70; transform: translate(-50%, -50%) scale(1.62); }
      90%  { opacity: .34; transform: translate(-50%, -50%) scale(1.78); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.92); }
    }

    /* Leichter dunkler Puff nur entlang des Goldrahmens.
       Liegt bewusst UNTER den bestehenden Einzel-Puffs / dem goldenen Bock-Puff. */
    .clip01-border-puff {
      position: absolute;
      inset: 0;
      z-index: 16;
      opacity: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% -4%, rgba(22,22,22,.72) 0 10%, transparent 36%),
        radial-gradient(ellipse at 50% 104%, rgba(18,18,18,.74) 0 11%, transparent 36%),
        radial-gradient(ellipse at -4% 50%, rgba(18,18,18,.76) 0 10%, transparent 35%),
        radial-gradient(ellipse at 104% 50%, rgba(18,18,18,.76) 0 10%, transparent 35%);
      box-shadow:
        inset 0 0 54px 24px rgba(10,10,10,.58),
        inset 0 0 105px 16px rgba(45,45,45,.22);
      filter: blur(3px);
      transform: scale(.97);
    }

    .clip01-border-puff.is-active {
      animation: clip01BorderPuff 1.08s ease-out forwards;
    }

    @keyframes clip01BorderPuff {
      0%   { opacity: 0; transform: scale(.965); filter: blur(2px); }
      16%  { opacity: .88; transform: scale(.99); filter: blur(3px); }
      42%  { opacity: .70; transform: scale(1.015); filter: blur(5px); }
      72%  { opacity: .34; transform: scale(1.035); filter: blur(8px); }
      100% { opacity: 0; transform: scale(1.055); filter: blur(12px); }
    }

    /* Kurzer Einschlag-Ruckler auf Bild + Animationslage gemeinsam. */
    .clip-stage.is-impacting .clip-stage__background,
    .clip-stage.is-impacting .clip-stage__background-next,
    .clip-stage.is-impacting .clip01-animation-layer {
      animation: clip01ImpactShake 390ms cubic-bezier(.2,.7,.25,1) both;
    }

    @keyframes clip01ImpactShake {
      0%   { transform: translate3d(0,0,0) scale(1); }
      12%  { transform: translate3d(-5px, 2px,0) scale(1.006); }
      24%  { transform: translate3d(6px,-3px,0) scale(1.008); }
      38%  { transform: translate3d(-4px, 3px,0) scale(1.006); }
      52%  { transform: translate3d(3px,-2px,0) scale(1.004); }
      68%  { transform: translate3d(-2px, 1px,0) scale(1.002); }
      84%  { transform: translate3d(1px,-1px,0) scale(1.001); }
      100% { transform: translate3d(0,0,0) scale(1); }
    }

    /* CLIP 02: sichere zentrale Bildzone - Rahmen/Wappen bleiben immer frei. */
    .clip02-animation-layer {
      position: absolute;
      inset: 0;
      z-index: 12;
      overflow: hidden;
      pointer-events: none;
    }

    .clip02-safe-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62vw;
      height: 60vh;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .clip02-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      object-position: center center;
      opacity: 0;
      transform: scale(.975);
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,.42));
    }

    .clip02-image.is-active:not(.clip02-image--final) {
      animation: clip02FlashImage 1s ease-in-out forwards;
    }

    @keyframes clip02FlashImage {
      0%   { opacity: 0; transform: scale(.975); }
      20%  { opacity: 1; transform: scale(1); }
      72%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.985); }
    }

    .clip02-image--final.is-active {
      animation: clip02FinalFadeIn 420ms ease-out forwards;
    }

    .clip02-image--final.is-ending {
      animation: clip02FinalFadeOut 500ms ease-in forwards;
    }

    @keyframes clip02FinalFadeIn {
      0%   { opacity: 0; transform: scale(.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes clip02FinalFadeOut {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(.99); }
    }

    /* CLIP 02 ENDBILD: dichter Zigarettenqualm direkt über dem Aschenbecher. */
    .clip02-cigarette-smoke {
      position: absolute;
      left: 50%;
      top: 79%;
      width: clamp(120px, 13vw, 250px);
      height: clamp(190px, 27vh, 360px);
      transform: translate(-50%, -100%);
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      filter: blur(1px);
      overflow: visible;
    }

    .clip02-cigarette-smoke.is-active {
      opacity: 1;
      transition: opacity 520ms ease-out;
    }

    .clip02-cigarette-smoke__wisp {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 44%;
      height: 52%;
      border-radius: 50%;
      opacity: 0;
      transform: translateX(-50%) scale(.55);
      background:
        radial-gradient(ellipse at 50% 78%,
          rgba(235,235,235,.66) 0 14%,
          rgba(190,190,190,.48) 28%,
          rgba(120,120,120,.26) 49%,
          transparent 72%);
      filter: blur(7px);
      mix-blend-mode: screen;
      animation: clip02SmokeRise 4.8s ease-in-out infinite;
      animation-delay: calc(var(--smoke-index) * -0.72s);
      will-change: transform, opacity;
    }

    .clip02-cigarette-smoke__wisp:nth-child(2n) {
      left: 43%;
      width: 52%;
      height: 58%;
      filter: blur(9px);
    }

    .clip02-cigarette-smoke__wisp:nth-child(3n) {
      left: 57%;
      width: 58%;
      height: 62%;
      filter: blur(11px);
    }

    @keyframes clip02SmokeRise {
      0% {
        opacity: 0;
        transform: translate(-50%, 10%) scale(.48) rotate(-4deg);
      }
      14% {
        opacity: .72;
      }
      38% {
        opacity: .62;
        transform: translate(-58%, -46%) scale(.9) rotate(5deg);
      }
      66% {
        opacity: .42;
        transform: translate(-39%, -105%) scale(1.28) rotate(-6deg);
      }
      100% {
        opacity: 0;
        transform: translate(-62%, -175%) scale(1.72) rotate(8deg);
      }
    }


    /* CLIP 03: direkter Start mit Hintergrund 2; keine Iris / kein Szenen-Fade. */
    .clip03-animation-layer {
      position: absolute;
      inset: 0;
      z-index: 14;
      overflow: hidden;
      pointer-events: none;
    }

    .clip03-final-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 1;
      pointer-events: none;
    }

    .clip03-scene-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }

    .clip03-symbol {
      position: absolute;
      z-index: 2;
      display: block;
      width: var(--clip03-symbol-width);
      height: auto;
      opacity: 1;
      transform:
        translate(-50%, -50%)
        scale(var(--clip03-symbol-scale, 1));
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.45));
    }

    .clip03-symbol.is-mirrored {
      transform:
        translate(-50%, -50%)
        scaleX(-1)
        scale(var(--clip03-symbol-scale, 1));
    }

    /* Clip 03: Gedös-Bild + Schrift, gemeinsam 3–11 s. */
    .clip03-gedoes-card {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 7;
      width: min(52vw, 820px);
      height: min(70vh, 780px);
      transform: translate(-50%, -50%) scale(.985);
      opacity: 0;
      pointer-events: none;
      transition: opacity 900ms cubic-bezier(.2,.72,.25,1),
                  transform 900ms cubic-bezier(.2,.72,.25,1);
    }

    .clip03-gedoes-card.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .clip03-gedoes-card.is-fading-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.99);
    }

    .clip03-gedoes-image {
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 7px 12px rgba(0,0,0,.42));
      user-select: none;
      pointer-events: none;
    }

    .clip03-gedoes-title {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 2;
      width: 88%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(18px, 2.15vw, 38px);
      line-height: 1.08;
      letter-spacing: .045em;
      text-shadow:
        -2px -2px 0 #a47a24,
         2px -2px 0 #a47a24,
        -2px  2px 0 #a47a24,
         2px  2px 0 #a47a24,
         0 3px 7px rgba(0,0,0,.88);
    }

    .clip03-gedoes-title strong,
    .clip03-gedoes-title em { display: block; }

    .clip03-gedoes-title strong { font-weight: 800; }

    .clip03-gedoes-title em {
      margin: .16em 0 .24em;
      font-size: .72em;
      font-weight: 400;
      letter-spacing: .02em;
    }

    .clip03-gedoes-subtitle {
      font-size: .76em;
      letter-spacing: .035em;
    }


    /* Clip 03: Burgenfolge rechts/mittig parallel zur Frau. */
    .clip03-castle-sequence {
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
    }

    .clip03-castle-card {
      position: absolute;
      left: 66%;
      top: 52%;
      width: min(43vw, 780px);
      height: min(61vh, 670px);
      transform: translate(-50%, -50%) scale(.985);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 900ms cubic-bezier(.2,.72,.25,1),
        transform 900ms cubic-bezier(.2,.72,.25,1);
    }

    .clip03-castle-card.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .clip03-castle-card.is-fading-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.99);
    }

    .clip03-castle-image {
      position: absolute;
      left: 50%;
      top: 52%;
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 8px 15px rgba(0,0,0,.48));
      user-select: none;
      pointer-events: none;
    }

    .clip03-castle-title {
      position: absolute;
      left: 50%;
      top: 49%;
      z-index: 2;
      width: 82%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #fff;
      opacity: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 1.55vw, 29px);
      line-height: 1.08;
      letter-spacing: .035em;
      text-shadow:
        -2px -2px 0 #a47a24,
         2px -2px 0 #a47a24,
        -2px  2px 0 #a47a24,
         2px  2px 0 #a47a24,
         0 3px 7px rgba(0,0,0,.92);
      transition: opacity 650ms ease-in-out;
      pointer-events: none;
    }

    .clip03-castle-title.is-visible { opacity: 1; }

    .clip03-castle-title strong,
    .clip03-castle-title em,
    .clip03-castle-title span {
      display: block;
    }

    .clip03-castle-title strong {
      font-size: 1.18em;
      font-weight: 800;
      margin-bottom: .12em;
    }

    .clip03-castle-title em {
      margin-bottom: .28em;
      font-size: .88em;
      font-weight: 400;
    }

    .clip03-castle-title span {
      margin-top: .14em;
      font-size: .72em;
      font-weight: 700;
    }


    /* Clip 03: Haus-Nuwenstein-Familienfolge nach Sekunde 24. */
    .clip03-family-sequence {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
    }

    .clip03-house-title {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(62vw, 920px);
      transform: translate(-50%, -50%) scale(.985);
      text-align: center;
      color: #185fa8;
      opacity: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4vw, 72px);
      font-weight: 900;
      letter-spacing: .055em;
      line-height: 1;
      text-shadow:
        -3px -3px 0 #fff,
         3px -3px 0 #fff,
        -3px  3px 0 #fff,
         3px  3px 0 #fff,
         0 5px 10px rgba(0,0,0,.72);
      transition:
        opacity 650ms cubic-bezier(.2,.72,.25,1),
        transform 650ms cubic-bezier(.2,.72,.25,1);
    }

    .clip03-house-title.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .clip03-house-title.is-fading-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.99);
    }

    .clip03-family-person {
      position: absolute;
      bottom: 49%;
      width: min(19vw, 300px);
      height: min(43vh, 490px);
      opacity: 0;
      transform: translateX(-50%) translateY(2%) scale(.985);
      transition:
        opacity 850ms cubic-bezier(.2,.72,.25,1),
        transform 850ms cubic-bezier(.2,.72,.25,1);
      pointer-events: none;
    }

    .clip03-family-person--hans { left: 41.5%; }
    .clip03-family-person--anna { left: 58.5%; }

    .clip03-family-person.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .clip03-family-person.is-fading-out {
      opacity: 0;
      transform: translateX(-50%) translateY(1%) scale(.99);
    }

    .clip03-family-image {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: block;
      max-width: 100%;
      max-height: 88%;
      width: auto;
      height: auto;
      transform: translateX(-50%);
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,.52));
      user-select: none;
    }

    .clip03-family-name {
      position: absolute;
      top: 8%;
      z-index: 2;
      width: min(16vw, 260px);
      transform: none;
      text-align: center;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 1.55vw, 29px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: .035em;
      text-shadow:
        -2px -2px 0 #a47a24,
         2px -2px 0 #a47a24,
        -2px  2px 0 #a47a24,
         2px  2px 0 #a47a24,
         0 3px 7px rgba(0,0,0,.92);
      white-space: normal;
    }

    .clip03-family-person--hans .clip03-family-name {
      right: calc(100% + .7vw);
      left: auto;
    }

    .clip03-family-person--anna .clip03-family-name {
      left: calc(100% + .7vw);
      right: auto;
    }

    /* Zwei überlappende goldene Eheringe zwischen Hans und Anna. */
    .clip03-marriage-rings {
      position: absolute;
      left: 50%;
      top: 31%;
      z-index: 12;
      width: clamp(120px, 12vw, 220px);
      height: clamp(78px, 8vw, 150px);
      transform: translate(-50%, -50%) scale(.86);
      opacity: 0;
      transition:
        opacity 700ms cubic-bezier(.2,.72,.25,1),
        transform 700ms cubic-bezier(.2,.72,.25,1);
      filter: drop-shadow(0 4px 7px rgba(0,0,0,.62));
    }

    .clip03-marriage-rings.is-visible {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .clip03-marriage-rings.is-fading-out {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.94);
    }

    .clip03-marriage-ring {
      position: absolute;
      top: 50%;
      width: 50%;
      aspect-ratio: 1;
      border: clamp(7px, .72vw, 13px) solid #d6a83b;
      border-radius: 50%;
      box-sizing: border-box;
      box-shadow:
        inset 0 0 0 2px rgba(255,239,164,.68),
        0 0 0 2px rgba(91,54,4,.72),
        0 4px 8px rgba(0,0,0,.55);
    }

    .clip03-marriage-ring--left {
      left: 12%;
      transform: translateY(-50%) rotate(-16deg);
    }

    .clip03-marriage-ring--right {
      right: 12%;
      transform: translateY(-50%) rotate(16deg);
    }


    /* Clip 03: sechs Nuwenstein-Kinder, ab Sekunde 33 im 1-s-Takt von links nach rechts. */
    .clip03-children-sequence {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    .clip03-child-card {
      position: absolute;
      left: calc(12.5% + (var(--child-index) * 15%));
      bottom: 7%;
      width: min(13vw, 210px);
      height: min(41vh, 470px);
      opacity: 0;
      transform: translateX(-50%) translateY(2.5%) scale(.975);
      transition:
        opacity 850ms cubic-bezier(.2,.72,.25,1),
        transform 850ms cubic-bezier(.2,.72,.25,1);
      pointer-events: none;
    }

    .clip03-child-card.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    .clip03-child-card.is-fading-out {
      opacity: 0;
      transform: translateX(-50%) translateY(1%) scale(.99);
    }

    .clip03-child-image {
      position: absolute;
      left: 50%;
      bottom: 0;
      display: block;
      max-width: 100%;
      max-height: 88%;
      width: auto;
      height: auto;
      transform: translateX(-50%);
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 7px 12px rgba(0,0,0,.50));
      user-select: none;
      pointer-events: none;
    }

    .clip03-child-name {
      position: absolute;
      left: 50%;
      bottom: 88.5%;
      top: auto;
      z-index: 2;
      width: 118%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(11px, 1.05vw, 20px);
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: .025em;
      text-shadow:
        -2px -2px 0 #a47a24,

        opacity 1100ms cubic-bezier(.22,.61,.36,1) !important;
      will-change:top,opacity;
    }

    .clip03-border-converge--helmet-left.is-converged,
    .clip03-border-converge--helmet-right.is-converged{
      top:42.4% !important;
    }

    .clip03-border-converge--crest-left.is-converged,
    .clip03-border-converge--crest-right.is-converged{
      top:57.6% !important;
    }

    .clip03-symbol.is-border-dissolving{
      opacity:0 !important;
      transition:opacity 1100ms cubic-bezier(.22,.61,.36,1) !important;
    }

    /* Sechs große Rauchfelder liegen jeweils genau über den aufgelösten Randobjekten. */
    .clip03-large-smoke--border{
      z-index:34;
      width:clamp(220px,24vw,480px);
      height:clamp(300px,50vh,650px);
      bottom:auto;
    }

    .clip03-border-smoke--helmet-left{left:6.3%;top:42%;}
    .clip03-border-smoke--sword-left{left:6.3%;top:51%;}
    .clip03-border-smoke--crest-left{left:6.3%;top:58%;}
    .clip03-border-smoke--helmet-right{left:93.3%;top:42%;}
    .clip03-border-smoke--sword-right{left:93.3%;top:51%;}
    .clip03-border-smoke--crest-right{left:93.3%;top:58%;}

    .clip03-large-smoke--border.is-ending{
      opacity:0;
      transform:translate(-50%,-12%) scale(1.18);
      transition:
        opacity 3000ms cubic-bezier(.22,.61,.36,1),
        transform 3000ms cubic-bezier(.22,.61,.36,1);
    }

    /* Neue Ritter erscheinen gleichzeitig hinter dem Rauch und bleiben stehen. */
    .clip03-border-knight{
      position:absolute;
      z-index:32;
      bottom:8.5%;
      width:min(36vw,620px);
      height:min(68vh,760px);
      opacity:0;
      pointer-events:none;
      transition:
        opacity 1200ms cubic-bezier(.2,.72,.25,1),
        transform 1200ms cubic-bezier(.2,.72,.25,1);
      filter:drop-shadow(0 9px 16px rgba(0,0,0,.52));
    }

    .clip03-border-knight img{
      display:block;
      max-width:100%;
      max-height:100%;
      width:auto;
      height:auto;
      object-fit:contain;
      user-select:none;
      pointer-events:none;
    }

    .clip03-border-knight--left{
      left:6.5%;
      transform:translateX(-4%) scale(.97);
      transform-origin:left bottom;
    }

    .clip03-border-knight--right{
      right:6.5%;
      transform:translateX(4%) scale(.97);
      transform-origin:right bottom;
    }

    .clip03-border-knight--right img{
      transform:scaleX(-1);
    }

    .clip03-border-knight--left.is-visible{
      opacity:1;
      transform:translateX(0) scale(1);
    }

    .clip03-border-knight--right.is-visible{
      opacity:1;
      transform:translateX(0) scale(1);
    }

</style>
</head>
